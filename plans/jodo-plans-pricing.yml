summary: >-
  Jodo publishes no pricing of any kind — no plan tiers, no per-transaction rate, no MDR, no interest
  rate on Cred, no platform fee, no API-usage pricing. The commercial motion is a demo request:
  every conversion path on the marketing site leads to "Book a demo" or "Contact us". Pricing is
  negotiated per institute.
