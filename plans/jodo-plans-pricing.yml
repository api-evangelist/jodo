commercial_notes:
- >-
  The API is not self-service. Jodo shares API keys and secrets per institute and per environment
  out of band (https://docs.jodo.in/getting-started/authentication/), so an integrator cannot obtain
  credentials — or discover a price — without a sales conversation.
- >-
  Cred is education lending originated with third-party NBFC partners (Avanse Financial Services,
  LiquiLoans, Lendbox, Eduvanz, Vivriti Capital, Fibe/EarlySalary, Ratnaafin, per
  https://www.jodo.in/lending-partners/). Loan pricing sits with those lenders, not Jodo, and the
  page publishes a "DLG Disclosure" document rather than rates.
- >-
  A separate self-serve product for MSMEs ("Collect for MSMEs: UPI Autopay, eNACH & reminders") is
  promoted in the docs banner, but it too publishes no pricing.
