deprecation_policy:
  published: true
  docs: https://docs.jodo.in/getting-started/api-structure/
  title: API Update Guidelines
  summary: >-
    Jodo publishes an explicit backward-compatibility contract, stating which changes it avoids and
    which it will introduce, and commits to a deprecation schedule when a breaking change is
    unavoidable.
  changes_avoided:
  - Removing or renaming request or response content fields
  - Removing or renaming query string parameters
  - Removing or changing the location of a resource
  - Changing the API domain
  changes_introduced:
  - Adding new resources
  - Adding new, optional request content fields
  - Adding new, optional query string parameters
  - Adding new response content fields
  - Adding new response header information
  breaking_change_commitment: >-
    "If, for any reason, we cannot avoid any of the non-backward compatible changes mentioned above,
    we will implement a deprecation schedule. This schedule will be provided to all customers with
    the goal of giving them adequate time to accommodate the updates."
  notice_period: not_stated
  beta_carve_out: >-
    "Undocumented resources and properties are considered to be in beta release and are subject to
    change without notification."
  peer_review: >-
    Jodo states every new or improved feature goes through a peer review process checking that it
    does not break current customer implementations and is consistent with existing resources.
  rfc8594_sunset_headers: false
  rfc8594_note: >-
    No Sunset or Deprecation response header is documented, and the API returns no version or
    deprecation signalling at runtime. The policy is prose on a docs page; an agent cannot detect a
    pending deprecation from a response.
  delivery_channel: >-
    "provided to all customers" — the channel is not named. There is no public deprecation feed,
    changelog or mailing list an integrator can subscribe to.
