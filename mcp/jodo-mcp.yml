readiness_assessment: >-
  Jodo is a poor MCP candidate as published, for two structural reasons rather than any missing tool.
  First, authentication is institute-wide HTTP Basic with no scopes, so an MCP server could not
  narrow an agent to read-only reference data — the credential that lists grades also creates payment
  links. Second, no request-level idempotency is documented on the payment-creating writes, so a
  retrying agent has no safe-replay guarantee. A read-only server over the GET operations would be
  materially safer than a full mapping.
