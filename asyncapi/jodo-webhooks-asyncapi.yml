  schemas:
    WebhookHeaders:
      type: object
      properties:
        X-Jodo-Signature:
          type: string
          description: HMAC SHA-256 hex digest of the raw request body, computed with the shared secret_key configured on
            the subscription. Present only when a secret_key is configured.
      description: Jodo can additionally send a custom header whose key and value the institute agrees with Jodo (header_key
        / header_value on the Add Webhook API).
    WebhookEnvelope:
      type: object
      required:
      - event_id
      - event
      - timestamp
      - version
      - payload
      properties:
        event_id:
          type: string
          description: 'A unique identifier for the webhook event. Use it as the deduplication key: the same event can be
            delivered more than once because of retries, network timeouts or delayed responses.'
          examples:
          - 37a87051-4b9f-4540-a155-2e8f2dd8354f
        event:
          type: string
          description: The event type / event_code.
        timestamp:
          type: integer
          description: The Unix timestamp when the event was originated.
          examples:
          - 1655448963
        version:
          type: string
          description: The version of the webhook payload format.
          examples:
          - '1.0'
        payload:
          $ref: '#/components/schemas/WebhookPayload'
    WebhookPayload:
      type: object
      description: 'Event-specific detail. The member objects present depend on the event: student events carry `student`;
        payment events carry `payment`; Flex events carry `subscription` and/or `payment_schedule`; Cred events carry `application`
        and/or `disbursement`. See the per-event docs page for the exact set.'
      properties:
        jodo_student_id:
          type:
          - string
          - integer
          description: The ID of the student in the Jodo system.
        student:
          $ref: '#/components/schemas/StudentContext'
        payment:
          $ref: '#/components/schemas/PaymentContext'
        subscription:
          $ref: '#/components/schemas/SubscriptionContext'
        payment_schedule:
          type: array
          description: Instalment details.
          items:
            $ref: '#/components/schemas/ScheduleInstalment'
        application:
          $ref: '#/components/schemas/LoanApplicationContext'
        disbursement:
          $ref: '#/components/schemas/DisbursementContext'
        order:
          $ref: '#/components/schemas/OrderContext'
    StudentContext:
      type: object
      properties:
        fullname:
          type: string
        identifier:
          type: string
          description: The student's identifier within your system (if applicable).
        custom_identifier:
          type: string
          description: A custom identifier associated with the student.
        collector_code:
          type:
          - string
          - 'null'
          description: Branch code, when configured.
        grade:
          type: object
          properties:
            code:
              type: string
              examples:
              - M1BLUE
            name:
              type: string
              examples:
              - Montessori 1
        academic_year_start:
          type: integer
        academic_year_end:
          type: integer
        primary_contact_number:
          type: string
        primary_contact_email:
          type: string
        notes:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
    PaymentContext:
      type: object
      properties:
        id:
          type: string
          description: The unique payment id in the Jodo system.
        amount:
          type: number
        product:
          type: string
          description: The payment product as per the Jodo system.
        mode:
          type: string
          description: The mode of payment.
        transaction_id:
          type: string
        notes:
          type: string
        settlement_utr:
          type: string
          description: The UTR for the disbursement done for the corresponding fee component.
        paid_at:
          type: string
          description: Datetime string indicating when the payment was made.
        details:
          type: array
          description: The fee-component-level breakdown of the payment.
          items:
            $ref: '#/components/schemas/FeeComponentAmount'
    FeeComponentAmount:
      type: object
      properties:
        fee_component:
          type: string
          description: The type of fee component, e.g. TUITION_FEE, TRANSPORT_FEE.
        amount:
          type: number
        settlement_utr:
          type: string
        settled_at:
          type: string
    SubscriptionContext:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the Flex subscription.
        status:
          type: string
          description: The current status of the Flex subscription.
    ScheduleInstalment:
      type: object
      properties:
        amount:
          type: integer
          description: Instalment amount.
        due_date:
          type: string
          description: The due date of an instalment in the payment schedule.
        details:
          type: array
          items:
            $ref: '#/components/schemas/FeeComponentAmount'
    LoanApplicationContext:
      type: object
      properties:
        id:
          type: integer
          description: The unique loan id in the Jodo system.
        status:
          type: string
          description: The current status of the loan application.
        amount:
          type: number
          description: The total amount for which the loan is taken.
        agreement_signed_at:
          type: string
          description: Datetime string indicating when the loan agreement was signed.
    DisbursementContext:
      type: object
      properties:
        id:
          type: integer
          description: The unique id for the disbursement in the Jodo system.
        date:
          type: string
          description: The date on which the disbursement was done.
        disbursed_amount:
          type: number
        amount:
          type: number
          description: The amount for the tranche.
        is_disbursed:
          type: boolean
    OrderContext:
      type: object
      properties:
        status:
          type: string
        transaction_id:
          type: string
        paid_at:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/FeeComponentAmount'
        notes:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
