method: probed
source: live probes of /.well-known/* on every Jodo host
summary: No Jodo-owned /.well-known document is served on any Jodo host. Every path on every host either 404s, returns
  the site's HTML shell with HTTP 200, or — in one case — serves a THIRD PARTY's document from a vendor-hosted subdomain.
  dashboard.jodo.in and app.jodo.in are single-page apps whose catch-all route answers 200 with the same HTML document
  for EVERY /.well-known/* path probed, including agent-card.json; that is the classic false-positive shape for
  this probe and is recorded as a miss. status.jodo.in serves a real security.txt, but it is ATLASSIAN'S, not Jodo's
  (see ownership note below). No WellKnown, SecurityTxt, APICatalog or AgentCard pointer is emitted in apis.yml
  as a result.
documents_served: 0
notable:
- No Jodo-owned /.well-known/security.txt (RFC 9116) on any host — no machine-readable vulnerability reporting address
  for a company handling school fee payments and consumer lending. The only security.txt reachable under a jodo.in
  name is Atlassian's, served by the status-page vendor.
- No /.well-known/openid-configuration or /oauth-authorization-server, consistent with the API being HTTP Basic
  Auth only.
- No /.well-known/api-catalog (RFC 9727).
- No A2A agent card at either /.well-known/agent-card.json or the legacy /.well-known/agent.json.
