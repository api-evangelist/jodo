ownership_note: 'OWNERSHIP: https://status.jodo.in/.well-known/security.txt returns HTTP 200 with a valid, PGP-signed
  RFC 9116 document — but it belongs to Atlassian, not Jodo. status.jodo.in is a Jodo-branded Atlassian Statuspage,
  and the vendor''s platform serves its own security.txt from every customer subdomain. The file says so plainly:
  Canonical is https://www.atlassian.com/.well-known/security.txt, both Contact lines are Atlassian (security@atlassian.com
  and atlassian.com/trust/security/report-a-vulnerability), the Policy and Encryption URLs are Atlassian''s, and
  the Hiring line points at Atlassian security jobs. Nothing in it routes a report about the Jodo API to Jodo. Crediting
  Jodo with a vulnerability disclosure programme on the strength of this file would attribute a vendor''s security
  posture to its customer. Saved verbatim as jodo-status-vendor-security.txt for the record, deliberately NOT wired
  to a SecurityTxt pointer.'
