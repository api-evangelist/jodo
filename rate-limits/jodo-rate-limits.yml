summary: >-
  Jodo confirms in two separate places that its API is rate limited, but publishes no number. Neither
  the "Rate Limits" section on the API Structure page nor the one on the Authentication page states a
  limit, a window, a burst allowance, or the scope the limit applies to (per key, per institute, per
  endpoint). No rate-limit response headers are documented. An integrator cannot size a batch, and an
  agent cannot pace itself except by reacting to a 429 after the fact.
documented_statements:
- quote: >-
    "Our API employs rate limiting to control the number of requests made by individual users or
    applications within a specified time period. This ensures the smooth functioning of the API,
    prevents misuse, and allows fair access to resources for all users."
  source: https://docs.jodo.in/getting-started/authentication/
- quote: >-
    "Jodo APIs may apply rate limits to protect system stability. If you receive a rate-limit response,
    retry with exponential backoff instead of retrying immediately."
  source: https://docs.jodo.in/getting-started/api-structure/
