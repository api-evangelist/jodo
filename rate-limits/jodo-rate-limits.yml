note: >-
  Interaction with the reliability contract: Jodo retries FAILED WEBHOOK deliveries up to 5 times over
  3 days, but nothing documents whether a 429 from the integrator's endpoint counts as a failed
  attempt, nor whether Jodo rate-limits its own outbound webhook delivery. Both directions are
