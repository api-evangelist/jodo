apis:
- name: Jodo Webhooks
  description: >-
    Event delivery surface for the Jodo platform. Jodo POSTs 36 documented events across student master
    data, manual payments, Flex subscriptions/mandates/instalments, Pay collections and Cred education
    loans to a URL the institute registers per event_code. At-least-once delivery with a published retry
    policy, event_id deduplication, HMAC SHA-256 X-Jodo-Signature verification, custom header validation
    and published source IP allowlists.
  humanURL: https://docs.jodo.in/webhooks/handling-webhook-events/
  baseURL: https://ext.jodo.in
  tags:
  - Webhooks
  - Events
  - Payments
