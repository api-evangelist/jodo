aid: jodo
name: Jodo
description: >-
  Jodo is a Bengaluru-based fintech that automates fee collection for Indian educational institutes —
  schools, colleges, universities, coaching centres and skilling institutes. Founded in 2020 by Atulya
  Bhat, Raghav Nagarajan and Koustav Dey, the company says it serves 5,000+ institutes across 90+ cities
  and has processed over INR 30,000 crore in fees for 25 lakh+ students. Jodo ships three products on one
  platform: Flex (structured fees paid in instalments through an auto-debit mandate), Pay (student-linked
  collections, hosted checkout orders and shareable payment links) and Cred (education loans originated
  with NBFC lending partners). Its public ERP Integrations API lets an institute's ERP, finance or
  student-information system register users and students, sync fee structures and discounts, reconcile
  manual payments, configure instalment schedules, create checkout orders and payment links, and manage
  webhook subscriptions. Jodo publishes a substantial developer reference at docs.jodo.in covering 25 REST
  operations and 36 webhook events, with documented UAT and production environments, Basic Auth, an error
  code registry, a retry and idempotency policy, HMAC SHA-256 webhook signatures and published source IP
  ranges — but no machine-readable OpenAPI or AsyncAPI document, and no public pricing.
