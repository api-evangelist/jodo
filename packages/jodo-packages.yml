platform_guides:
  note: >-
    The "Platforms" section (React Native, Android, Web) is NOT an SDK. Each guide is a copy-paste
    integration recipe for embedding Jodo's HOSTED checkout in a WebView or browser window, built
    entirely on standard platform primitives — android.webkit.WebView, the community
    react-native-webview package, and window.location.assign. Jodo publishes no wrapper of its own
    around any of them.
  third_party_dependencies:
  - name: react-native-webview
    registry: npm
    official: false
    first_party: false
    note: >-
      A community package Jodo's React Native guide instructs the integrator to install
      (`npm install react-native-webview`). It is not published or maintained by Jodo and wraps no
      Jodo API; recorded here only so the dependency is not mistaken for a Jodo SDK.
  docs: https://docs.jodo.in/platforms/overview/
distribution_note: >-
  No CDN-distributed script tag, embed loader or drop-in JS bundle is published either — the hosted
  flow is entered by navigating to a redirect_url minted server-side, not by loading a Jodo script.
consumer_impact: >-
  Every integrator writes and maintains their own HTTP client, retry logic, webhook signature
  verification and payload models against a documentation site with no machine-readable contract. The
  webhook signature check in particular is left to the integrator from a five-line Python example.
