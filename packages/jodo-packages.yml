summary: >-
  Jodo publishes NO first-party client libraries. There is no Jodo SDK on npm, PyPI, Maven Central,
  NuGet, RubyGems, Packagist, crates.io or pkg.go.dev, and the GitHub organisation github.com/jodohq
  (HTTP 200, created 2021-01-31, name "Jodo", website www.jodo.in) has zero public repositories.
  Integration is raw HTTP with Basic Auth; the documentation ships static curl, Python (requests),
  PHP (HTTP_Request2) and NodeJS snippets rather than a library.
