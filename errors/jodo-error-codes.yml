coverage_note: >-
  Jodo publishes no consolidated error-code reference page. The four codes above are every code
  named anywhere across the 85 documentation pages crawled on 2026-08-23; the HUE/MAE prefixes
  imply a wider internal registry that is not published. An integrator cannot enumerate the error
  space in advance and must handle unknown codes defensively.
gaps:
