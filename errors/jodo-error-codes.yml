docs: https://docs.jodo.in/getting-started/api-structure/
format: proprietary
rfc9457: false
note: >-
  Jodo does not use RFC 9457 application/problem+json. Errors are returned in the same JSON envelope
  as successes, carrying an HTTP status code, a user-facing message and a machine-readable code.
  The docs describe the contract as "an HTTP status code along with an error message and
  machine-readable error code in the response body".
envelope:
  content_type: application/json
  shape:
    status: 'string — "error"'
    code: 'string — machine-readable Jodo error code'
    message: 'string — user-friendly explanation of the error'
  note: >-
    The docs state the shape in prose and show error codes in per-endpoint tables, but do not publish
    a worked error response example. The field names above are the documented components; confirm the
    exact JSON keys against a live 4xx response before writing a parser.
status_codes:
- status: 400
  meaning: Bad Request. The request contains invalid or missing data.
- status: 401
  meaning: Unauthorized. Authentication failed or credentials are invalid.
- status: 403
  meaning: Forbidden. The caller does not have access to the resource.
- status: 404
  meaning: Not Found. The specified resource could not be found.
- status: 405
  meaning: Method Not Allowed. The HTTP method is not valid for the resource.
- status: 406
  meaning: Not Acceptable. The requested format is unsupported.
- status: 409
  meaning: Conflict. The requested operation conflicts with current resource state.
- status: 429
  meaning: Too many requests.
- status: 500
  meaning: Internal Server Error. Try again later.
- status: 502
  meaning: Bad Gateway. An upstream service is temporarily unavailable.
- status: 503
  meaning: Service Unavailable. The API is temporarily offline or under maintenance.
